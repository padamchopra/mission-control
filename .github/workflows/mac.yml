name: Mac

on:
  # A release is a nightly, not a consequence of merging. Run it at 00:05 UTC,
  # or on demand when a merge is worth shipping straight away.
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide on a cheap runner whether there is anything to ship, so a quiet day
  # does not sign and notarise the same commit again under a new version.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, so the last release's commit can be resolved.
          fetch-depth: 0

      - name: Anything new since the last release?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run someone asked for is a decision, not a schedule; always build.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Asked for by hand — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No release yet — building the first one."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          released="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [ -z "$released" ]; then
            echo "Cannot resolve $tag to a commit — building rather than guessing."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$released" = "$GITHUB_SHA" ]; then
            echo "$tag is already this commit ($GITHUB_SHA) — nothing to ship."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$(git rev-list --count "$released..$GITHUB_SHA") commit(s) since $tag — building."
          echo "build=true" >> "$GITHUB_OUTPUT"

  dmg:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=
          for name in CSC_LINK APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Unsigned GitHub downloads are blocked by macOS. Missing secrets:$missing. See README Publishing a Mac build."
            exit 1
          fi

      - name: App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          node desktop/scripts/write-asc-key.mjs "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          version="$(node desktop/scripts/stamp-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Stamped $version from run ${GITHUB_RUN_NUMBER}"

      - name: Install
        run: npm run install:all

      - name: Build, sign, and notarize
        run: npm run pack:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: remy-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: desktop/release/*.dmg,desktop/release/*.zip,desktop/release/*.blockmap,desktop/release/latest*.yml
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
